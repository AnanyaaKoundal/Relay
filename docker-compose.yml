services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: relay-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS}
    volumes:
      - rustfs-data:/data
    command: /data

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  rustfs-data:
  redis-data:
